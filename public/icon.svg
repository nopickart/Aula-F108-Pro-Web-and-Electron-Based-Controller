<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Keyboard Case Outer -->
  <rect x="44" y="96" width="424" height="320" rx="28" fill="#1e293b" stroke="#334155" stroke-width="6"/>
  <rect x="56" y="108" width="400" height="296" rx="20" fill="#090d16" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Mini LCD Screen (Top Right) -->
  <rect x="330" y="126" width="110" height="56" rx="8" fill="url(#lcdGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <circle cx="426" cy="138" r="3" fill="#10b981"/>
  <text x="385" y="152" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">12:34</text>
  <text x="385" y="168" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">AULA F108</text>

  <!-- Function Row Keys -->
  <rect x="72" y="126" width="36" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="116" y="126" width="36" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="160" y="126" width="36" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="204" y="126" width="36" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="248" y="126" width="36" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 1 Numbers -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
    <rect x="72" y="164" width="30" height="30" rx="6"/>
    <rect x="108" y="164" width="30" height="30" rx="6"/>
    <rect x="144" y="164" width="30" height="30" rx="6"/>
    <rect x="180" y="164" width="30" height="30" rx="6"/>
    <rect x="216" y="164" width="30" height="30" rx="6"/>
    <rect x="252" y="164" width="30" height="30" rx="6"/>
    <rect x="288" y="164" width="30" height="30" rx="6"/>
  </g>

  <!-- WASD cluster (Glowing Cyan) -->
  <!-- W -->
  <rect x="144" y="202" width="30" height="30" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="159" y="222" fill="#e0f2fe" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">W</text>

  <!-- A, S, D -->
  <rect x="108" y="240" width="30" height="30" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="123" y="260" fill="#e0f2fe" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">A</text>

  <rect x="144" y="240" width="30" height="30" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="159" y="260" fill="#e0f2fe" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">S</text>

  <rect x="180" y="240" width="30" height="30" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="195" y="260" fill="#e0f2fe" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">D</text>

  <!-- Surrounding keys -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
    <!-- Row 2 -->
    <rect x="72" y="202" width="32" height="30" rx="6"/>
    <rect x="108" y="202" width="30" height="30" rx="6"/>
    <rect x="180" y="202" width="30" height="30" rx="6"/>
    <rect x="216" y="202" width="30" height="30" rx="6"/>
    <rect x="252" y="202" width="30" height="30" rx="6"/>
    <rect x="288" y="202" width="30" height="30" rx="6"/>

    <!-- Row 3 -->
    <rect x="72" y="240" width="32" height="30" rx="6"/>
    <rect x="216" y="240" width="30" height="30" rx="6"/>
    <rect x="252" y="240" width="30" height="30" rx="6"/>
    <rect x="288" y="240" width="46" height="30" rx="6"/>

    <!-- Row 4 -->
    <rect x="72" y="278" width="42" height="30" rx="6"/>
    <rect x="120" y="278" width="30" height="30" rx="6"/>
    <rect x="156" y="278" width="30" height="30" rx="6"/>
    <rect x="192" y="278" width="30" height="30" rx="6"/>
    <rect x="228" y="278" width="30" height="30" rx="6"/>
    <rect x="264" y="278" width="50" height="30" rx="6"/>

    <!-- Spacebar Row -->
    <rect x="72" y="316" width="34" height="30" rx="6"/>
    <rect x="112" y="316" width="30" height="30" rx="6"/>
    <rect x="148" y="316" width="134" height="30" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <rect x="288" y="316" width="30" height="30" rx="6"/>
  </g>

  <!-- Numpad Cluster (including tall + and enter keys!) -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
    <!-- Numpad row 1: Num / * - -->
    <rect x="330" y="194" width="24" height="24" rx="5"/>
    <rect x="358" y="194" width="24" height="24" rx="5"/>
    <rect x="386" y="194" width="24" height="24" rx="5"/>
    <rect x="414" y="194" width="24" height="24" rx="5"/>

    <!-- Numpad 7 8 9 and tall + key -->
    <rect x="330" y="224" width="24" height="24" rx="5"/>
    <rect x="358" y="224" width="24" height="24" rx="5"/>
    <rect x="386" y="224" width="24" height="24" rx="5"/>
    <!-- Tall 2u + Key! -->
    <rect x="414" y="224" width="24" height="54" rx="5" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <text x="426" y="256" fill="#e0f2fe" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">+</text>

    <!-- Numpad 4 5 6 -->
    <rect x="330" y="254" width="24" height="24" rx="5"/>
    <rect x="358" y="254" width="24" height="24" rx="5"/>
    <rect x="386" y="254" width="24" height="24" rx="5"/>

    <!-- Numpad 1 2 3 and tall Enter key! -->
    <rect x="330" y="284" width="24" height="24" rx="5"/>
    <rect x="358" y="284" width="24" height="24" rx="5"/>
    <rect x="386" y="284" width="24" height="24" rx="5"/>
    <!-- Tall 2u Enter Key! -->
    <rect x="414" y="284" width="24" height="54" rx="5" fill="#083344" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="426" y="315" fill="#e0f2fe" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">↵</text>

    <!-- Numpad 0 (2u) and . -->
    <rect x="330" y="314" width="52" height="24" rx="5"/>
    <rect x="386" y="314" width="24" height="24" rx="5"/>
  </g>

  <!-- Glowing underline accent at bottom of keyboard -->
  <path d="M 56 400 L 456 400" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Logo text -->
  <text x="256" y="468" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="4" text-anchor="middle">AULA F108 PRO</text>
  <text x="256" y="490" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="11" letter-spacing="2" text-anchor="middle">LINUX CONTROLLER</text>
</svg>
